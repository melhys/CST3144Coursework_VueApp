<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillNest</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">

        <header class="header">
            <div class="container d-flex justify-content-between align-items-center py-3">
                <a href="#" class="brand" @click.prevent="showCart = false">
                    <i class="fa-solid fa-graduation-cap"></i> {{title}}
                </a>
                <button class="btn cart-btn" @click="toggleCart" :disabledd="cartCout === 0">
                    <i class="fa-solid fa-cart-shopping"></i> 
                </button>
            </div>
        </header>

        <main class="container pb-5">
            <div v-if="!showCart">
                <section class="hero rounded-4 p-4 p-md-5 my-4">
                    <h1>Find the perfect after-school class</h1>
                    <p class="mb-0">Sports, arts and academics for every student.</p>
                </section>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <h2 class="h4 mb-0">Classes For You!</h2>
                    <div class="d-flex gap-2">
                        <select class="form-select form-select-sm pill-select" v-model="sortBy">
                            <option value="topic">Subject</option>
                            <option value="location">Location</option>
                            <option value="price">Price</option>
                            <option value="space">Spaces</option>
                        </select>
                        <select class="form-select form-select-sm pill-select" v-model="sortOrder">
                            <option value="asc">Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>
                </div>

                <div v-if="loadError" class="alert alert-danger">{{ loadError }}</div>


            </div>
        </main>
    </div>
<script>
    const lessons_json = 'data/data.json';

    Vue.createApp({
        data(){
            return{
                title: 'SkillNest',
                lessons: [],
                loadError: '',
                cart: [],                
                showCart: false,
                selectedLesson: null,   
                sortBy: 'topic',
                sortOrder: 'asc',
                order: { name: '', phone: '' },
            };
        },
        created(){
            this.fetchLessons();
        },
        computed: {
            cartCount() {
                return this.cart.length;
            }
        },
        methods:{
            
        }
    }).mount('#app')
</script>    
</body>
</html>
